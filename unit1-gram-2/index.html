  <script>
const quizConfig={unit:"1",title:"GERUND & INFINITIVE",lesson:"GRAMMAR QUIZ 2",randomizeChoices:true,
questions:[
[1,"Choose the Correct Form","CHOOSE THE CORRECT FORM.","The committee appreciated ______ so much effort into organizing the charity event.",["put","to put","putting","puts"],"putting","'Appreciate' is always followed by a gerund (verb + -ing).","Think about the pattern that usually follows the verb 'appreciate'."],
[1,"Choose the Correct Form","CHOOSE THE CORRECT FORM.","The new student wants ______ friends quickly at his new school.",["making","make","to make","made"],"to make","'Want' is always followed by an infinitive (to + verb).","Think about the pattern that usually follows the verb 'want'."],
[1,"Choose the Correct Form","CHOOSE THE CORRECT FORM.","The two ministers discussed ______ the new education reform at the press conference.",["announce","to announce","announcing","announced"],"announcing","'Discuss' is always followed by a gerund (verb + -ing).","Think about the pattern that usually follows the verb 'discuss'."],
[2,"Complete the Sentence","COMPLETE THE SENTENCE.","The young actor pretended ______ surprised when he won the award, although he already knew.",["being","to be","be","been"],"to be","'Pretend' is always followed by an infinitive (to + verb).","Think about the pattern that usually follows the verb 'pretend'."],
[2,"Complete the Sentence","COMPLETE THE SENTENCE.","The workers finally finished ______ the new bridge after eighteen months of construction.",["build","to build","building","built"],"building","'Finish' is always followed by a gerund (verb + -ing).","Think about the pattern that usually follows the verb 'finish'."],
[2,"Complete the Sentence","COMPLETE THE SENTENCE.","Moroccan universities hope ______ more international students in the coming years.",["attracting","attract","to attract","attracted"],"to attract","'Hope' is always followed by an infinitive (to + verb).","Think about the pattern that usually follows the verb 'hope'."],
[3,"Know the Pattern","WHICH PATTERN FOLLOWS THIS VERB?","Which pattern follows the verb \"keep\"?",["keep + to + verb","keep + verb","keep + verb-ing","keep + past participle"],"keep + verb-ing","'Keep' takes the gerund pattern: keep + verb-ing.","Think about how you would complete 'He kept ______ during the ceremony.'"],
[3,"Know the Pattern","WHICH PATTERN FOLLOWS THIS VERB?","Which pattern follows the verb \"arrange\"?",["arrange + verb-ing","arrange + verb","arrange + to + verb","arrange + past participle"],"arrange + to + verb","'Arrange' takes the infinitive pattern: arrange + to + verb.","Think about how you would complete 'They arranged ______ the guests at the airport.'"],
[3,"Know the Pattern","WHICH PATTERN FOLLOWS THIS VERB?","Which pattern follows the verb \"imagine\"?",["imagine + to + verb","imagine + verb-ing","imagine + verb","imagine + bare infinitive"],"imagine + verb-ing","'Imagine' takes the gerund pattern: imagine + verb-ing.","Think about how you would complete 'I can't imagine ______ in such a big city.'"],
[4,"Diagnose: Find and Correct the Error","CHOOSE THE CORRECT VERSION.","❌ She misses to travel with her family during the summer holidays.",["She misses travelling with her family during the summer holidays.","She misses travel with her family during the summer holidays.","She misses to travelling with her family during the summer holidays.","She misses travelled with her family during the summer holidays."],"She misses travelling with her family during the summer holidays.","'Miss' must be followed by a gerund, not an infinitive.","Think about which structure the verb 'miss' requires in general."],
[4,"Diagnose: Find and Correct the Error","CHOOSE THE CORRECT VERSION.","❌ The teacher made us to clean the classroom after the football match.",["The teacher made us clean the classroom after the football match.","The teacher made us cleaning the classroom after the football match.","The teacher made us to cleaning the classroom after the football match.","The teacher made us cleaned the classroom after the football match."],"The teacher made us clean the classroom after the football match.","'Make' is followed by the bare infinitive: 'made us clean'.","Think about what follows a causative verb like 'make'."],
[5,"Understand Meaning","CHOOSE THE CORRECT MEANING.","What does this sentence mean? \"I'll never forget visiting the Sahara Desert with my family.\"",["I will always have that memory.","I need a reminder to visit the Sahara Desert.","I have never been to the Sahara Desert.","I am planning to visit the Sahara Desert soon."],"I will always have that memory.","'Never forget + gerund' refers to a lasting memory.","Think about whether this describes a past memory or future obligation."],
[5,"Understand Meaning","CHOOSE THE CORRECT MEANING.","What does this sentence mean? \"I can't help laughing whenever he tells that joke.\"",["I refuse to laugh at that joke.","I am unable to stop myself from laughing.","I need assistance to understand the joke.","I never laugh at that joke."],"I am unable to stop myself from laughing.","'Can't help + gerund' means being unable to control a reaction.","Think about what it means when someone says they can't help doing something."],
[5,"Understand Meaning","CHOOSE THE CORRECT MEANING.","What does this sentence mean? \"Youssef is looking forward to starting university next semester.\"",["Youssef is dreading the start of university.","Youssef is excited and eager about starting university.","Youssef has already started university.","Youssef has decided not to attend university."],"Youssef is excited and eager about starting university.","'Look forward to + gerund' expresses eagerness about the future.","Think about the feeling this expression conveys."],
[6,"Transform","CHOOSE THE SENTENCE WITH THE SAME MEANING.","Choose the sentence with the same meaning: \"I don't want to go out tonight; I'd rather stay home.\"",["I feel like staying home tonight.","I pretend to stay home tonight.","I arranged to stay home tonight.","I finished staying home tonight."],"I feel like staying home tonight.","'Would rather' and 'feel like' both express a present preference.","Think about which option expresses the same preference."],
[6,"Transform","CHOOSE THE SENTENCE WITH THE SAME MEANING.","Choose the sentence with the same meaning: \"Ali said he would help with the charity event without being asked.\"",["Ali volunteered to help with the charity event.","Ali begged to help with the charity event.","Ali swore to help with the charity event.","Ali imagined helping with the charity event."],"Ali volunteered to help with the charity event.","'Volunteer + infinitive' means offering to do something unasked.","Think about which verb means offering to help on your own."],
[7,"Grammar in Context","COMPLETE THE SITUATION.","Aicha wants to boost her listening skills before the National Exam. She practises ______ podcasts in English every day.",["listening","listen","to listen","listened"],"listening","'Practise' is always followed by a gerund.","Think about the pattern that follows 'practise'."],
[7,"Grammar in Context","COMPLETE THE SITUATION.","Nadia always checks her answer sheet twice before ______ it to the exam supervisor.",["handing","hand","to hand","handed"],"handing","A preposition such as 'before' is followed by a gerund.","Think about what follows a preposition like 'before'."],
[8,"Final Challenge: Mixed Grammar","CHOOSE THE CORRECT SENTENCE.","Choose the correct sentence:",["He swore to tell the truth in court, and the lawyer begged to speak with the witness privately.","He swore telling the truth in court, and the lawyer begged speaking with the witness privately.","He swore to tell the truth in court, and the lawyer begged speaking with the witness privately.","He swore telling the truth in court, and the lawyer begged to speak with the witness privately."],"He swore to tell the truth in court, and the lawyer begged to speak with the witness privately.","'Swear' and 'beg' are followed by infinitives.","Think about the structure both verbs require."],
[8,"Final Challenge: Mixed Grammar","CHOOSE THE CORRECT SENTENCE.","Choose the correct sentence:",["Every candidate must switch off their phone before the exam starts, and they should arrive at least twenty minutes early.","Every candidate must switching off their phone before the exam starts, and they should to arrive at least twenty minutes early.","Every candidate must to switch off their phone before the exam starts, and they should arriving at least twenty minutes early.","Every candidate must switching off their phone before the exam starts, and they should arriving at least twenty minutes early."],"Every candidate must switch off their phone before the exam starts, and they should arrive at least twenty minutes early.","Modal verbs take the bare infinitive: 'must switch' and 'should arrive'.","Think about what follows modal verbs like 'must' and 'should'."]]
};
const questions=quizConfig.questions.map((q,i)=>({id:i,level:q[0],category:q[1],question:q[2],task:q[3],choices:q[4],correctAnswer:q[5],explanation:q[6],hint:q[7],points:1}));
let index=0,answers=Array(20).fill(null),elapsed=0,timerId=null,choiceOrders;
const $=id=>document.getElementById(id);
const timer={start(){clearInterval(timerId);timerId=setInterval(()=>{elapsed++;renderStats()},1000)},pause(){clearInterval(timerId)},reset(){this.pause();elapsed=0},format(){return String(Math.floor(elapsed/60)).padStart(2,"0")+":"+String(elapsed%60).padStart(2,"0")}};
function shuffled(a){return [...a].sort(()=>Math.random()-.5)}
choiceOrders=questions.map(q=>shuffled(q.choices));
function sound(ok){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?600:180;g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.22);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.22)}catch(e){}}
function renderStats(){const correct=answers.filter(a=>a&&a.correct).length,wrong=answers.filter(a=>a&&!a.correct).length;$("correctStat").textContent=`✅ Correct: ${correct}`;$("wrongStat").textContent=`❌ Wrong: ${wrong}`;$("remainingStat").textContent=`Remaining: ${20-correct-wrong}`;$("scoreStat").textContent=`Score: ${correct.toFixed(2)} /20`;$("timerStat").textContent=`Timer ${timer.format()}`}
function renderQuestion(){let q=questions[index],a=answers[index];$("instruction").textContent=q.question;$("task").textContent=q.task;$("counter").textContent=`${index+1} / 20`;$("hintText").textContent=q.hint;$("hintText").classList.remove("show");$("feedback").className="feedback";$("choices").innerHTML="";
choiceOrders[index].forEach((choice,i)=>{let b=document.createElement("button");b.className="choice";b.type="button";b.innerHTML=`<span class="letter">${"ABCD"[i]}</span>${choice}`;if(a){b.disabled=true;if(choice===q.correctAnswer)b.classList.add("correct");if(choice===a.choice&&!a.correct)b.classList.add("wrong")}else b.onclick=()=>answer(choice);$("choices").appendChild(b)});
if(a){$("feedback").className="feedback show "+(a.correct?"good":"bad");$("feedback").innerHTML=`<strong>${a.message}</strong><div class="explanation">${q.explanation}</div>`}$("previousButton").disabled=index===0;$("nextButton").disabled=!a;$("nextButton").textContent=index===19?"See Results":"Next ▶";renderStats()}
function answer(choice){if(answers[index])return;let q=questions[index],correct=choice===q.correctAnswer;answers[index]={choice,correct,message:(correct?["Excellent!","Great Job!","Perfect!","Keep Going!"]:["Almost!","Review this rule.","Keep learning!","You'll get the next one!"])[Math.floor(Math.random()*4)]};sound(correct);renderQuestion()}
function result(){timer.pause();let correct=answers.filter(a=>a&&a.correct).length,wrong=20-correct,accuracy=(correct/20*100).toFixed(0),old=JSON.parse(localStorage.getItem("giQuiz")||"{}"),attempts=(old.attempts||0)+1,best=Math.max(old.best||0,correct);localStorage.setItem("giQuiz",JSON.stringify({attempts,best,last:correct,time:timer.format()}));$("quizView").style.display="none";$("resultView").classList.add("show");$("scoreBadge").textContent=`${correct.toFixed(2)} /20`;let r=correct<11?["Keep Practising!","Review which verbs are followed by gerunds, which take infinitives, and verbs whose meanings change with the structure."]:correct<15?["Good!","You understand the basics, but you need more practice with verb patterns and meaning changes."]:correct<18?["Very Good!","You understand most gerund and infinitive patterns, but review a few exceptions."]:["Excellent!","You have a very good command of gerunds and infinitives."];$("remarkDesc").textContent=r[1];let words=["Keep Practising!","Good!","Very Good!","Excellent!"],n=0,cycle=setInterval(()=>{$("remark").textContent=words[n++%4]},120);setTimeout(()=>{clearInterval(cycle);$("remark").textContent=r[0]},3000);let levels=[["Choose the Correct Form",3],["Complete the Sentence",3],["Know the Pattern",3],["Diagnose",2],["Understand Meaning",3],["Transform",2],["Grammar in Context",2],["Final Challenge",2]];$("summary").innerHTML=`<h2>Performance Summary</h2><div class="summary-grid"><div class="metric">Final Score<br><b>${correct.toFixed(2)} /20</b></div><div class="metric">Correct Answers<br><b>${correct}</b></div><div class="metric">Wrong Answers<br><b>${wrong}</b></div><div class="metric">Accuracy<br><b>${accuracy}%</b></div><div class="metric">Time Taken<br><b>${timer.format()}</b></div><div class="metric">Attempts / Best Score<br><b>${attempts} / ${best.toFixed(2)}</b></div></div><div class="levels">${levels.map((l,i)=>{let got=questions.filter(q=>q.level===i+1).filter(q=>answers[q.id].correct).length;return `<div class="level-row">Level ${i+1} — ${l[0]}: <b>${got}/${l[1]}</b></div>`}).join("")}</div>`;if(correct>=18)confetti()}
function confetti(){for(let i=0;i<80;i++){let d=document.createElement("i");d.className="confetti";d.style.left=Math.random()*100+"%";d.style.background=["#2563eb","#16a34a","#f59e0b","#dc2626"][i%4];d.style.animationDelay=Math.random()*1.4+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),5000)}}
$("hintButton").onclick=()=>$("hintText").classList.add("show");$("previousButton").onclick=()=>{if(index>0){index--;renderQuestion()}};$("nextButton").onclick=()=>{if(!answers[index])return;if(index===19)result();else{index++;renderQuestion()}};$("restartButton").onclick=()=>{index=0;answers=Array(20).fill(null);timer.reset();choiceOrders=questions.map(q=>shuffled(q.choices));$("resultView").classList.remove("show");$("quizView").style.display="block";timer.start();renderQuestion()};$("reviewButton").onclick=()=>{$("resultView").classList.remove("show");$("reviewView").classList.add("show");$("reviewContent").innerHTML=questions.map(q=>`<article class="review-item ${answers[q.id].correct?"correct-review":"wrong-review"}"><b>Level ${q.level} — ${q.category}</b><p>${q.task}</p><p>Student Answer: ${answers[q.id].choice}</p><p>Correct Answer: ${q.correctAnswer}</p><p>Explanation: ${q.explanation}</p></article>`).join("")};$("backButton").onclick=()=>{$("reviewView").classList.remove("show");$("resultView").classList.add("show")};$("printButton").onclick=()=>window.print();$("saveButton").onclick=()=>{let text=$("summary").innerText+"\nTime Taken: "+timer.format(),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/plain"}));a.download="grammar-quiz-results.txt";a.click();URL.revokeObjectURL(a.href)};document.addEventListener("keydown",e=>{if(["1","2","3","4"].includes(e.key)&&!answers[index]){let b=$("choices").children[+e.key-1];if(b)b.click()}if(e.key==="ArrowLeft")$("previousButton").click();if(e.key==="ArrowRight"&&answers[index])$("nextButton").click()});timer.start();renderQuestion();

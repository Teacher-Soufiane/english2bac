  <script>
    const quizConfig={
      unit:"1",title:"THE GIFTS OF YOUTH",lesson:"VOCABULARY - QUIZ 2",teacherName:"Teacher Soufiane",
      randomizeQuestions:false,randomizeChoices:true,timerEnabled:true,timerMode:"countup",countdownSeconds:600,showConfetti:true,enableSounds:true,
      questions:[
        ["single-choice","Choose the word that matches the definition","CHOOSE THE WORD THAT MATCHES THE DEFINITION.","The quality of being truthful and sincere, without lying or cheating.",["honesty","energy","responsibility","patience"],"honesty","Honesty is the quality of always telling the truth and being sincere."],
        ["single-choice","Choose the word that matches the definition","CHOOSE THE WORD THAT MATCHES THE DEFINITION.","The physical and mental strength that allows you to be active without getting tired.",["energy","honesty","patience","responsibility"],"energy","Energy is the strength and vitality required for sustained physical or mental activity."],
        ["single-choice","Choose the word that matches the definition","CHOOSE THE WORD THAT MATCHES THE DEFINITION.","The state of being in charge of something and expected to deal with it properly.",["responsibility","honesty","energy","patience"],"responsibility","Responsibility means being accountable for a task, duty, or person."],
        ["single-choice","Choose the word that matches the definition","CHOOSE THE WORD THAT MATCHES THE DEFINITION.","The ability to wait calmly for a long time without becoming annoyed or upset.",["patience","energy","honesty","responsibility"],"patience","Patience is the capacity to accept delay or difficulty without becoming annoyed."],
        ["single-choice","Put the word in brackets in its correct form","PUT THE WORD IN BRACKETS IN ITS CORRECT FORM.","Shouting at people without any reason is a sign of ______ behavior. (rudeness)",["rude","rudeness","rudely","ruder"],"rude","We need an adjective before 'behavior', so 'rudeness' becomes 'rude'."],
        ["single-choice","Put the word in brackets in its correct form","PUT THE WORD IN BRACKETS IN ITS CORRECT FORM.","Leaving your keys in the car overnight was a very ______ thing to do. (carelessness)",["careless","carelessness","carelessly","carefulness"],"careless","We need an adjective after 'very', so 'carelessness' becomes 'careless'."],
        ["single-choice","Put the word in brackets in its correct form","PUT THE WORD IN BRACKETS IN ITS CORRECT FORM.","Refusing to change his opinion even with new evidence shows how ______ he is. (stubbornness)",["stubborn","stubbornness","stubbornly","unstubborn"],"stubborn","We need an adjective after 'how', so 'stubbornness' becomes 'stubborn'."],
        ["single-choice","Put the word in brackets in its correct form","PUT THE WORD IN BRACKETS IN ITS CORRECT FORM.","Some young people act in an ______ way when they refuse to take responsibility for their actions. (immaturity)",["immature","immaturity","immaturely","maturity"],"immature","We need an adjective before 'way', so 'immaturity' becomes 'immature'."],
        ["single-choice","Fill in the gap with the appropriate word from the list","FILL IN THE GAP WITH THE APPROPRIATE WORD FROM THE LIST.","Bullying at school is often linked to ______, when a student physically or verbally hurts another.",["violence","racism","selfishness","envy"],"violence","'Violence' fits because the sentence describes physical or verbal harm."],
        ["single-choice","Fill in the gap with the appropriate word from the list","FILL IN THE GAP WITH THE APPROPRIATE WORD FROM THE LIST.","Judging someone based on their skin color or origin is a clear example of ______.",["racism","violence","selfishness","envy"],"racism","'Racism' fits because the sentence describes prejudice based on race or origin."],
        ["single-choice","Fill in the gap with the appropriate word from the list","FILL IN THE GAP WITH THE APPROPRIATE WORD FROM THE LIST.","Thinking only about your own needs without caring for others is called ______.",["selfishness","violence","racism","envy"],"selfishness","'Selfishness' fits because the sentence describes caring only about oneself."],
        ["single-choice","Fill in the gap with the appropriate word from the list","FILL IN THE GAP WITH THE APPROPRIATE WORD FROM THE LIST.","Feeling resentful because someone else has something you want is known as ______.",["envy","violence","racism","selfishness"],"envy","'Envy' fits because the sentence describes wanting what someone else has."],
        ["single-choice","Choose the word that completes the collocation","CHOOSE THE WORD THAT COMPLETES THE COLLOCATION.","If you keep interrupting me, I might ______ my patience.",["lose","take","make","do"],"lose","'Lose your patience' is the correct natural collocation in English."],
        ["single-choice","Choose the word that completes the collocation","CHOOSE THE WORD THAT COMPLETES THE COLLOCATION.","As team captain, she had to ______ responsibility for the whole group's performance.",["take","make","do","have"],"take","'Take responsibility' is the correct natural collocation in English."],
        ["single-choice","Choose the word that completes the collocation","CHOOSE THE WORD THAT COMPLETES THE COLLOCATION.","He always tries to ______ a good example for his younger siblings.",["set","make","take","do"],"set","'Set an example' is the correct natural collocation in English."],
        ["single-choice","Choose the word that completes the collocation","CHOOSE THE WORD THAT COMPLETES THE COLLOCATION.","Our school team hopes to ______ first place in the regional competition.",["win","make","take","do"],"win","'Win a competition' or 'win first place' is the correct natural collocation in English."],
        ["three-synonyms","Three Synonyms Challenge","SELECT THE THREE WORDS THAT ARE SYNONYMS OF THE TARGET WORD.","FAMOUS",["well-known","renowned","celebrated","unknown"],["well-known","renowned","celebrated"],"unknown","'Well-known', 'renowned', and 'celebrated' all describe someone widely recognized, like 'famous'. 'Unknown' means the opposite — not recognized by many people."],
        ["three-synonyms","Three Synonyms Challenge","SELECT THE THREE WORDS THAT ARE SYNONYMS OF THE TARGET WORD.","RISKY",["dangerous","hazardous","precarious","safe"],["dangerous","hazardous","precarious"],"safe","'Dangerous', 'hazardous', and 'precarious' all describe something likely to cause harm, like 'risky'. 'Safe' means the opposite — free from danger."],
        ["three-synonyms","Three Synonyms Challenge","SELECT THE THREE WORDS THAT ARE SYNONYMS OF THE TARGET WORD.","HARMFUL",["damaging","destructive","detrimental","harmless"],["damaging","destructive","detrimental"],"harmless","'Damaging', 'destructive', and 'detrimental' all describe something that causes harm, like 'harmful'. 'Harmless' means the opposite — causing no harm at all."],
        ["three-synonyms","Three Synonyms Challenge","SELECT THE THREE WORDS THAT ARE SYNONYMS OF THE TARGET WORD.","COWARDLY",["fearful","timid","spineless","brave"],["fearful","timid","spineless"],"brave","'Fearful', 'timid', and 'spineless' all describe a lack of courage, like 'cowardly'. 'Brave' means the opposite — showing courage in the face of danger."]
      ].map((q,i)=>q[0]==="single-choice"?{id:i,type:q[0],category:q[1],question:q[2],task:q[3],choices:q[4],correctAnswer:q[5],explanation:q[6],points:1}:{id:i,type:q[0],category:q[1],question:q[2],targetWord:q[3],options:q[4],correctSynonyms:q[5],antonym:q[6],explanation:q[7],points:1})
    };

    const $=id=>document.getElementById(id), shuffle=a=>[...a].sort(()=>Math.random()-.5);
    let questions=[],states=[],currentIndex=0,synonymTimer=null,isRendering=false,pendingTileAction=null;
    const feedbackGood=["Excellent!","Great Job!","Perfect!","Keep Going!"],feedbackBad=["Almost!","Review this rule.","Keep learning!","You'll get the next one!"];
    const categoryNames=["Definitions","Word Forms","Word Bank","Collocations","Synonyms Challenge"];

    /* Independent count-up/count-down timer module. */
    const timer=(()=>{
      let seconds=0,interval=null,running=false;
      const format=s=>String(Math.max(0,Math.floor(s/60))).padStart(2,"0")+":"+String(Math.max(0,s%60)).padStart(2,"0");
      const paint=()=>{$("timer-stat").textContent="Timer: "+format(seconds)};
      return{start(){if(!quizConfig.timerEnabled||running)return;running=true;interval=setInterval(()=>{seconds+=quizConfig.timerMode==="countdown"?-1:1;paint();if(quizConfig.timerMode==="countdown"&&seconds<=0){this.pause();finishQuiz()}},1000)},pause(){running=false;clearInterval(interval)},reset(){this.pause();seconds=quizConfig.timerMode==="countdown"?quizConfig.countdownSeconds:0;paint()},format,get value(){return seconds}};
    })();

    function audio(tone){if(!quizConfig.enableSounds)return;try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=tone;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.07,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);o.start();o.stop(c.currentTime+.18)}catch(e){}}
    function newQuiz(){
      questions=quizConfig.questions.map(q=>({...q,choices:q.choices?shuffle(q.choices):undefined,options:q.options?shuffle(q.options):undefined}));
      states=questions.map(()=>({answered:false,answer:null,selected:new Set(),correct:false,evaluationPending:false}));
      currentIndex=0;timer.reset();renderQuestion();timer.start();
    }
    function updateStats(){
      const correct=states.filter(s=>s.answered&&s.correct).length,wrong=states.filter(s=>s.answered&&!s.correct).length;
      $("correct-stat").textContent="✅ Correct: "+correct;$("wrong-stat").textContent="❌ Wrong: "+wrong;$("remaining-stat").textContent="Remaining: "+(20-correct-wrong);$("score-stat").textContent="Score: "+correct.toFixed(2)+" /20";
    }
    function renderQuestion(){
      clearTimeout(synonymTimer);isRendering=true;
      const q=questions[currentIndex],s=states[currentIndex];$("instruction-box").textContent=q.question;
      $("task-area").innerHTML=q.type==="three-synonyms"?'<div class="target-word">'+q.targetWord+'</div>':q.task;
      $("choices-area").innerHTML="";$("feedback").className="feedback hidden";$("feedback").innerHTML="";
      q.type==="single-choice"?renderSingleChoice(q,s):renderSynonyms(q,s);
      $("question-counter").textContent=(currentIndex+1)+" / "+questions.length;$("previous-button").disabled=currentIndex===0;
      $("next-button").disabled=!s.answered;$("next-button").textContent=currentIndex===questions.length-1?"Finish ▶":"Next ▶";updateStats();
      isRendering=false;
      if(pendingTileAction){const action=pendingTileAction;pendingTileAction=null;action()}
    }
    function renderSingleChoice(q,s){
      q.choices.forEach((choice,i)=>{const b=document.createElement("button");b.type="button";b.className="answer-btn";b.dataset.index=i;b.innerHTML='<span class="choice-key">'+(i+1)+'</span>'+choice;
        if(s.answered){b.disabled=true;if(choice===q.correctAnswer)b.classList.add("correct");if(choice===s.answer&&choice!==q.correctAnswer)b.classList.add("wrong")}
        else b.addEventListener("click",()=>answerSingle(choice));$("choices-area").appendChild(b)});if(s.answered)showFeedback(q,s);
    }
    function answerSingle(choice){const q=questions[currentIndex],s=states[currentIndex];if(s.answered)return;s.answer=choice;s.correct=choice===q.correctAnswer;s.answered=true;audio(s.correct?620:180);renderQuestion()}
    /* Synonym tiles use the Set in this state's object as the one source of truth.
       Deferred clicks are queued while rendering, preventing dropped clicks mid-update. */
    function renderSynonyms(q,s){
      q.options.forEach((option,i)=>{const b=document.createElement("button");b.type="button";b.className="answer-btn";b.dataset.index=i;b.innerHTML='<span class="choice-key">'+(i+1)+'</span>'+option;
        if(!s.answered&&s.selected.has(i))b.classList.add("selected");
        if(s.answered){b.disabled=true;const correct=q.correctSynonyms.includes(option),chosen=s.selected.has(i);if(correct)b.classList.add("correct");else if(chosen)b.classList.add("wrong");else b.classList.add("antonym-neutral");if(option===q.antonym){const tag=document.createElement("span");tag.className="tag";tag.textContent=chosen?"antonym, not a synonym":"antonym";b.appendChild(tag)}}else b.addEventListener("click",()=>toggleSynonym(i));
        $("choices-area").appendChild(b)});if(s.answered)showFeedback(q,s);
    }
    function toggleSynonym(index){
      if(isRendering){pendingTileAction=()=>toggleSynonym(index);return}
      const s=states[currentIndex];if(s.answered)return;clearTimeout(synonymTimer);
      if(s.selected.has(index)){s.selected.delete(index);s.evaluationPending=false;audio(300)}else if(s.selected.size<3){s.selected.add(index);audio(440)}
      renderQuestion();
      /* At exactly three selections allow a short reconsideration window before locking. */
      if(s.selected.size===3){s.evaluationPending=true;synonymTimer=setTimeout(()=>evaluateSynonyms(currentIndex),500)}
    }
    /* Evaluation sets the same answered flag as Type A, unlocking Next immediately. */
    function evaluateSynonyms(index){
      if(index!==currentIndex)return;const q=questions[index],s=states[index];if(s.answered||s.selected.size!==3)return;
      const selected=[...s.selected].map(i=>q.options[i]);s.correct=selected.length===3&&selected.every(x=>q.correctSynonyms.includes(x));s.answer=selected;s.answered=true;s.evaluationPending=false;audio(s.correct?620:180);renderQuestion();
    }
    function showFeedback(q,s){const box=$("feedback"),message=(s.correct?feedbackGood:feedbackBad)[Math.floor(Math.random()*4)];box.className="feedback "+(s.correct?"good":"bad");box.innerHTML="<strong>"+message+"</strong>"+q.explanation}
    function goNext(){if(!states[currentIndex].answered)return;if(currentIndex===questions.length-1)finishQuiz();else{currentIndex++;renderQuestion()}}
    function goPrevious(){if(currentIndex>0){currentIndex--;renderQuestion()}}
    function categoryScores(){return [0,1,2,3,4].map(c=>states.slice(c*4,c*4+4).filter(s=>s.correct).length)}
    function finalRemark(score){return score<10?"Fail":score<12?"Pass":score<14?"Fairly Good":score<16?"Good":score<18?"Very Good":"Excellent!"}
    function finishQuiz(){
      clearTimeout(synonymTimer);timer.pause();$("quiz-view").classList.add("hidden");$("review-view").classList.add("hidden");$("result-view").classList.remove("hidden");
      const score=states.filter(s=>s.correct).length,wrong=20-score,accuracy=(score/20*100).toFixed(0),attempts=(+localStorage.getItem("english2bacAttempts")||0)+1,best=Math.max(+localStorage.getItem("english2bacBest")||0,score);
      localStorage.setItem("english2bacAttempts",attempts);localStorage.setItem("english2bacBest",best);localStorage.setItem("english2bacLast",score);localStorage.setItem("english2bacTime",timer.format(timer.value));
      $("score-badge").textContent=score.toFixed(2)+" /20";$("summary-grid").innerHTML=[["Final Score",score.toFixed(2)+" /20"],["Correct Answers",score],["Wrong Answers",wrong],["Accuracy",accuracy+"%"],["Time Taken",timer.format(timer.value)],["Attempts",attempts],["Best Score",best.toFixed(2)+" /20"]].map(x=>'<div class="summary-item"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join("");
      $("breakdown-list").innerHTML=categoryScores().map((s,i)=>"<div>"+categoryNames[i]+": <b>"+s+"/4</b></div>").join("");animateRemark(finalRemark(score));audio(820);if(score>=16&&quizConfig.showConfetti)confetti();
    }
    function animateRemark(final){const el=$("final-remark"),labels=["Fail","Pass","Fairly Good","Good","Very Good","Excellent!"];let n=0,delay=90;function spin(){el.textContent=labels[n++%labels.length];if(n<20){setTimeout(spin,delay);delay+=18}else el.textContent=final}spin()}
    function confetti(){const layer=$("confetti-layer");layer.innerHTML="";for(let i=0;i<90;i++){const p=document.createElement("i");p.className="confetti";p.style.left=Math.random()*100+"%";p.style.background=["#2563eb","#16a34a","#f6b73c","#dc3d3d"][i%4];p.style.animationDelay=Math.random()*1.3+"s";layer.appendChild(p)}setTimeout(()=>layer.innerHTML="",5200)}
    function review(){const groups={};questions.forEach((q,i)=>(groups[q.category]??=[]).push([q,i]));$("review-content").innerHTML=Object.entries(groups).map(([name,items])=>'<section class="review-group"><h2>'+name+'</h2>'+items.map(([q,i])=>{const s=states[i],status=s.correct?"good":"bad";if(q.type==="single-choice")return '<article class="review-question '+status+'"><p><b>Question '+(i+1)+':</b> '+q.task+'</p><p><b>Student Answer:</b> '+s.answer+'</p><p><b>Correct Answer:</b> '+q.correctAnswer+'</p><p><b>Explanation:</b> '+q.explanation+'</p></article>';return '<article class="review-question '+status+'"><p><b>Target Word:</b> '+q.targetWord+'</p><p><b>Student’s 3 selections:</b> '+s.answer.join(", ")+'</p><p><b>Correct 3 synonyms:</b> '+q.correctSynonyms.join(", ")+'</p><p><b>Antonym distractor:</b> '+q.antonym+'</p><p><b>Explanation:</b> '+q.explanation+'</p></article>'}).join("")+'</section>').join("");$("result-view").classList.add("hidden");$("review-view").classList.remove("hidden")}
    function report(){const score=states.filter(s=>s.correct).length;return "ENGLISH2BAC QUIZZES\nUnit 1 — THE GIFTS OF YOUTH\nVOCABULARY - QUIZ 2\n\nFinal Score: "+score.toFixed(2)+" /20\nCorrect Answers: "+score+"\nWrong Answers: "+(20-score)+"\nTime Taken: "+timer.format(timer.value)+"\n\nCATEGORY BREAKDOWN\n"+categoryScores().map((v,i)=>categoryNames[i]+": "+v+"/4").join("\n")}
    $("previous-button").onclick=goPrevious;$("next-button").onclick=goNext;$("review-button").onclick=review;$("back-results-button").onclick=()=>{$("review-view").classList.add("hidden");$("result-view").classList.remove("hidden")};$("restart-button").onclick=()=>{$("result-view").classList.add("hidden");$("review-view").classList.add("hidden");$("quiz-view").classList.remove("hidden");newQuiz()};$("print-button").onclick=()=>window.print();$("save-button").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([report()],{type:"text/plain"}));a.download="English2BAC-Quiz-Results.txt";a.click();URL.revokeObjectURL(a.href)};
    document.addEventListener("keydown",e=>{if($("quiz-view").classList.contains("hidden"))return;const q=questions[currentIndex],s=states[currentIndex];if(e.key==="ArrowLeft")goPrevious();if(e.key==="ArrowRight"||e.key==="Enter"){if(s.answered)goNext()}const n=Number(e.key);if(n>=1&&n<=4&&!s.answered){e.preventDefault();q.type==="single-choice"?answerSingle(q.choices[n-1]):toggleSynonym(n-1)}if(e.key===" "&&s.answered){e.preventDefault();goNext()}});
    newQuiz();
  </script>

      questions:[
        {type:"drag-classify",category:"Classify the Expressions",question:"CLASSIFY THE EXPRESSIONS INTO THE CORRECT CATEGORY.",columns:["Express Opinion","Ask for Opinion","Agreement","Disagreement"],tiles:[
          {id:"t1",text:"For me, …",correctColumn:"Express Opinion"},{id:"t2",text:"It seems to me that …",correctColumn:"Express Opinion"},{id:"t3",text:"To my mind, I see that…",correctColumn:"Express Opinion"},{id:"t4",text:"What is your opinion about…?",correctColumn:"Ask for Opinion"},{id:"t5",text:"What do you think of …?",correctColumn:"Ask for Opinion"},{id:"t6",text:"Don't you think that…?",correctColumn:"Ask for Opinion"},{id:"t7",text:"I totally agree with you.",correctColumn:"Agreement"},{id:"t8",text:"I share the same point of view.",correctColumn:"Agreement"},{id:"t9",text:"I'm afraid I disagree with you.",correctColumn:"Disagreement"},{id:"t10",text:"I don't share your point of view.",correctColumn:"Disagreement"}],

        {type:"matching",category:"Match the Sentence with its Function",question:"MATCH THE SENTENCE WITH ITS FUNCTION.",pairs:[{id:"1",sentence:"I completely agree. Technology has changed education for the better.",correctFunction:"Expressing Agreement"},{id:"2",sentence:"Personally, I believe that traveling broadens the mind.",correctFunction:"Expressing Opinion"},{id:"3",sentence:"I don't see it that way at all.",correctFunction:"Expressing Disagreement"},{id:"4",sentence:"What's your opinion on climate change?",correctFunction:"Asking for Opinion"}],functionOptions:["Asking for Opinion","Expressing Disagreement","Responding to Good News","Expressing Opinion","Expressing Agreement"],explanation:"'Responding to Good News' is the distractor here — none of the four sentences respond to good news; they express opinion, agreement, disagreement, or ask for an opinion.",points:2},

      $("previous-btn").disabled=state.index===0;$("next-btn").disabled=!state.answers[state.index];
    }
    function markAnswered(answer){state.answers[state.index]=answer;updateStats()}
    function render(){
      if(state.completed)return;
      const q=current();$("instruction").textContent=q.question;$("task-area").innerHTML="";state.selected=null;
      if(q.type==="drag-classify")renderClassify(q);if(q.type==="drag-order")renderOrder(q);if(q.type==="matching")renderMatching(q);if(q.type==="single-choice")renderChoice(q);if(q.type==="complete-exchange")renderComplete(q);
      const prompt=document.createElement("div");prompt.className="task-prompt";prompt.textContent=q.question;$('task-area').prepend(prompt);
      updateStats();
    }

    /* Type A: native drag/drop plus click or keyboard pick-up and placement fallback. */
    function renderClassify(q){
      const saved=state.answers[state.index];
      if(!saved&&!state.classifyOrder)state.classifyOrder=shuffle(q.tiles);
      const tileOrder=saved?q.tiles:state.classifyOrder;
      const pool=document.createElement("div");pool.className="tile-pool";pool.id="tile-pool";pool.tabIndex=0;
      const grid=document.createElement("div");grid.className="classify-grid";
      q.columns.forEach(col=>{const zone=document.createElement("div");zone.className="drop-zone";zone.dataset.column=col;zone.tabIndex=0;zone.innerHTML=`<div class="column-head">${col}</div><div class="placed-stack"></div>`;bindDropZone(zone);grid.appendChild(zone)});
      const renderTiles=()=>{
        pool.innerHTML="";document.querySelectorAll(".placed-stack").forEach(x=>x.innerHTML="");
        tileOrder.forEach(tile=>{const el=tileElement(tile,saved);const col=saved?saved.placements[tile.id]:state.placements[tile.id];(col?grid.querySelector(`[data-column="${CSS.escape(col)}"] .placed-stack`):pool).appendChild(el)});
      };
      $("task-area").append(pool,grid);renderTiles();
      if(!saved){const row=document.createElement("div");row.className="check-row";row.innerHTML='<button type="button" class="action-btn" id="check-classify" disabled>Check Answers</button><span id="classify-hint">Place all 10 expressions, then check.</span>';$("task-area").appendChild(row);const check=$("check-classify");const refresh=()=>check.disabled=Object.keys(state.placements).length!==10;refresh();
        $("task-area").addEventListener("tileplaced",()=>{renderTiles();refresh()});
        check.onclick=()=>{const placements={...state.placements};let pts=0,correct=0;q.tiles.forEach(t=>{if(placements[t.id]===t.correctColumn){pts++;correct++}});markAnswered({placements,points:pts,correctCount:correct,wrongCount:10-correct});sound(correct===10?"good":"bad");render();}
      }else{q.tiles.forEach(t=>{const el=[...$("task-area").querySelectorAll(".tile")].find(x=>x.dataset.id===t.id);const ok=saved.placements[t.id]===t.correctColumn;el.classList.add(ok?"result-good":"result-bad");if(!ok)el.insertAdjacentHTML("beforeend",`<span class="correct-note">Correct: ${t.correctColumn}</span>`)});showFeedback(q.explanation,feedback(saved.points>0));}
      function tileElement(tile,locked){
        const el=document.createElement("button");el.type="button";el.className="tile";el.draggable=!locked;el.dataset.id=tile.id;el.textContent=tile.text;
        if(!locked){el.addEventListener("dragstart",e=>{e.dataTransfer.setData("tile",tile.id);sound("click")});el.onclick=()=>{document.querySelectorAll(".tile").forEach(x=>x.classList.remove("selected"));state.selected=tile.id;el.classList.add("selected");sound("click")};el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();el.click()}if(["ArrowRight","ArrowLeft"].includes(e.key)){const zones=[...document.querySelectorAll(".drop-zone")];zones[(e.key==="ArrowRight"?0:zones.length-1)].focus()}}}
        return el;
      }
      function bindDropZone(zone){zone.addEventListener("dragover",e=>{e.preventDefault();zone.classList.add("over")});zone.addEventListener("dragleave",()=>zone.classList.remove("over"));zone.addEventListener("drop",e=>{e.preventDefault();zone.classList.remove("over");place(e.dataTransfer.getData("tile"),zone.dataset.column)});zone.onclick=()=>state.selected&&place(state.selected,zone.dataset.column);zone.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();if(state.selected)place(state.selected,zone.dataset.column)}if(["ArrowRight","ArrowLeft"].includes(e.key)){const zones=[...document.querySelectorAll(".drop-zone")];zones[(zones.indexOf(zone)+(e.key==="ArrowRight"?1:zones.length-1))%zones.length].focus()}}}
      function place(id,column){if(!id)return;state.placements[id]=column;state.selected=null;$("task-area").dispatchEvent(new Event("tileplaced"));sound("click")}
    }

    /* Type B: dragging and arrow controls update the same ordering model; checking grades positions independently. */
    function renderOrder(q){
      const saved=state.answers[state.index];let order=saved?[...saved.order]:[...state.order];
      const list=document.createElement("div");list.className="order-list";$("task-area").appendChild(list);
      function draw(){
        list.innerHTML="";order.forEach((id,index)=>{const line=q.lines.find(x=>x.id===id),card=document.createElement("div");card.className="order-card";card.draggable=!saved;card.tabIndex=0;card.dataset.id=id;card.innerHTML=`<span class="drag-mark">⠿</span><span>${line.text}</span>${saved?"":'<span class="move-controls"><button class="mini-btn" aria-label="Move up">▲</button><button class="mini-btn" aria-label="Move down">▼</button></span>'}`;
          if(!saved){card.ondragstart=e=>e.dataTransfer.setData("line",id);card.ondragover=e=>e.preventDefault();card.ondrop=e=>{const moving=e.dataTransfer.getData("line"),from=order.indexOf(moving),to=order.indexOf(id);order.splice(from,1);order.splice(to,0,moving);state.order=[...order];draw();sound("click")};card.querySelectorAll(".mini-btn")[0].onclick=()=>move(index,-1);card.querySelectorAll(".mini-btn")[1].onclick=()=>move(index,1);card.onkeydown=e=>{if(e.key==="ArrowUp"){e.preventDefault();move(index,-1)}if(e.key==="ArrowDown"){e.preventDefault();move(index,1)}}}
          list.appendChild(card)});
        if(saved)q.correctOrder.forEach((id,pos)=>{const card=list.children[order.indexOf(id)],ok=order[pos]===id;card.classList.add(ok?"result-good":"result-bad");if(!ok)card.querySelector("span:nth-child(2)").insertAdjacentHTML("beforeend",`<span class="correct-note">Correct position: ${pos+1}</span>`)});
      }
      function move(i,d){const n=i+d;if(n<0||n>=order.length)return;[order[i],order[n]]=[order[n],order[i]];state.order=[...order];draw();sound("click")}
      draw();
      if(!saved){const row=document.createElement("div");row.className="check-row";row.innerHTML='<button type="button" class="action-btn" id="check-order">Check Order</button>';$("task-area").appendChild(row);$("check-order").onclick=()=>{let correct=order.filter((id,i)=>id===q.correctOrder[i]).length;markAnswered({order:[...order],points:correct*.5,correctCount:correct,wrongCount:4-correct});sound(correct===4?"good":"bad");render()}}
      else showFeedback(q.explanation,feedback(saved.points>0));
    }

    /* Type C: each independent selector is saved and graded separately for partial credit. */
    function renderMatching(q){
      const saved=state.answers[state.index],list=document.createElement("div");list.className="match-list";
      q.pairs.forEach((p,i)=>{const row=document.createElement("div");row.className="match-row";const id="match-"+p.id;row.innerHTML=`<label for="${id}">${i+1}. ${p.sentence}</label><select id="${id}" ${saved?"disabled":""}><option value="">Select a function…</option>${q.functionOptions.map(x=>`<option ${((saved?saved.matches:state.matches)[p.id]===x)?"selected":""}>${x}</option>`).join("")}</select>`;const select=row.querySelector("select");if(!saved)select.onchange=()=>{state.matches[p.id]=select.value;sound("click");$("check-matches").disabled=q.pairs.some(a=>!state.matches[a.id])};else{const ok=saved.matches[p.id]===p.correctFunction;row.classList.add(ok?"result-good":"result-bad");if(!ok)row.insertAdjacentHTML("beforeend",`<span class="correct-note">Correct: ${p.correctFunction}</span>`)}list.appendChild(row)});
      $("task-area").appendChild(list);
      if(!saved){const row=document.createElement("div");row.className="check-row";row.innerHTML='<button type="button" class="action-btn" id="check-matches" disabled>Check Matches</button>';$("task-area").appendChild(row);$("check-matches").onclick=()=>{let correct=q.pairs.filter(p=>state.matches[p.id]===p.correctFunction).length;markAnswered({matches:{...state.matches},points:correct*.5,correctCount:correct,wrongCount:4-correct});sound(correct===4?"good":"bad");render()}}
      else showFeedback(q.explanation,feedback(saved.points>0));
    }

    function renderChoice(q){
      const saved=state.answers[state.index];$("task-area").innerHTML=`<div class="task-text">${q.task}</div><div class="choices" id="choice-list"></div>`;
      q._displayChoices ||= shuffle(q.choices);const choices=q._displayChoices;choices.forEach((choice,i)=>{const b=document.createElement("button");b.type="button";b.className="choice";b.textContent=`${i+1}. ${choice}`;if(saved){if(choice===q.correctAnswer)b.classList.add("correct");if(choice===saved.choice&&choice!==q.correctAnswer)b.classList.add("wrong");b.disabled=true}else b.onclick=()=>{const ok=choice===q.correctAnswer;markAnswered({choice,points:ok?1:0,correctCount:ok?1:0,wrongCount:ok?0:1});sound(ok?"good":"bad");render()};$("choice-list").appendChild(b)});
      if(!saved)document.onkeydown=e=>{if(["1","2","3"].includes(e.key))$("choice-list").children[+e.key-1]?.click()};else{document.onkeydown=null;showFeedback(q.explanation,feedback(saved.points>0))}
    }

    /* Type E: selection stays blue until Check Answer; the missing bubble becomes the correct completed response after grading. */
    function renderComplete(q){
      const saved=state.answers[state.index],dialogue=document.createElement("div");dialogue.className="dialogue";
      q.dialogue.forEach((turn,i)=>{const b=document.createElement("div");const side=i%2===0?"left":"right";b.className="bubble "+side+(turn.text==="..."?" missing":"");b.id=turn.text==="..."?"missing-bubble":"";b.innerHTML=`<strong>${turn.speaker}</strong><span>${saved&&turn.text==="..."?q.correctAnswer:turn.text}</span>`;dialogue.appendChild(b)});$("task-area").appendChild(dialogue);
      const choices=document.createElement("div");choices.className="choices";q._displayChoices ||= shuffle(q.choices);const ordered=q._displayChoices;
      ordered.forEach((choice,i)=>{const b=document.createElement("button");b.type="button";b.className="choice";b.textContent=`${i+1}. ${choice}`;if(saved){if(choice===q.correctAnswer)b.classList.add("correct");if(choice===saved.choice&&choice!==q.correctAnswer)b.classList.add("wrong");b.disabled=true}else b.onclick=()=>{state.selected=choice;choices.querySelectorAll(".choice").forEach(x=>x.classList.toggle("selected",x.textContent.endsWith(choice)));$("check-complete").disabled=false;sound("click")};choices.appendChild(b)});$("task-area").appendChild(choices);
      const tag=document.createElement("div");tag.className="function-tag"+(saved?" show":"");tag.textContent="Function: "+q.function;$("task-area").appendChild(tag);
      if(!saved){const row=document.createElement("div");row.className="check-row";row.innerHTML='<button type="button" class="action-btn" id="check-complete" disabled>Check Answer</button>';$("task-area").appendChild(row);$("check-complete").onclick=()=>{const ok=state.selected===q.correctAnswer;markAnswered({choice:state.selected,points:ok?1:0,correctCount:ok?1:0,wrongCount:ok?0:1});sound(ok?"good":"bad");render()};document.onkeydown=e=>{if(["1","2","3","4"].includes(e.key))choices.children[+e.key-1]?.click();if(e.key==="Enter"&&!$("check-complete").disabled)$("check-complete").click()}}
      else{document.onkeydown=null;showFeedback(q.explanation,feedback(saved.points>0))}
    }

    function showFeedback(explanation,message){const d=document.createElement("div");d.className="feedback show";d.innerHTML=`<strong>${message}</strong><br>${explanation}`;$("task-area").appendChild(d)}
    $("previous-btn").onclick=()=>{if(state.index>0){state.index--;render()}};
    $("next-btn").onclick=()=>{if(!state.answers[state.index])return;if(state.index===8)finishQuiz();else{state.index++;render()}};

    async function initStorage(){
      const handler={onDataChanged(data){state.records=data;const r=data[0];if(r)state.stats={best:r.best_score||0,attempts:r.attempts||0,last:r.last_score||0,time:r.time_taken||0}}};
      const res=await window.dataSdk.init(handler);if(!res.isOk)return;
    }
    async function saveProgress(){
      const value={best_score:Math.max(state.stats.best,state.score),attempts:state.stats.attempts+1,last_score:state.score,time_taken:timer.value()};
      if(state.records[0])await window.dataSdk.update({...state.records[0],...value});else await window.dataSdk.create(value);
      state.stats={best:value.best_score,attempts:value.attempts,last:value.last_score,time:value.time_taken};
    }
    function remark(){const s=state.score;return s<10?"Fail":s<12?"Pass":s<14?"Fairly Good":s<16?"Good":s<18?"Very Good":"Excellent!"}
    function finishQuiz(){state.completed=true;timer.pause();sound("complete");saveProgress();$("quiz-view").classList.add("hidden");const accuracy=Math.round((state.correct/(state.correct+state.wrong||1))*100);$("results-view").classList.remove("hidden");$("results-view").innerHTML=`<div class="results-top"><div style="font-weight:800;color:#123b70">ENGLISH2BAC QUIZZES</div><h1 style="margin:8px 0;color:#123b70">${quizConfig.title}</h1><p>UNIT ${quizConfig.unit} · ${quizConfig.lesson}</p><div class="score-badge">${state.score.toFixed(2)}<small style="font-size:15px"> /20</small></div><div id="remark" class="remark">...</div><div class="summary-grid"><div class="summary-item"><b>Final Score</b><span>${state.score.toFixed(2)} /20</span></div><div class="summary-item"><b>Correct Answers</b><span>${state.correct}</span></div><div class="summary-item"><b>Wrong Answers</b><span>${state.wrong}</span></div><div class="summary-item"><b>Accuracy</b><span>${accuracy}%</span></div><div class="summary-item"><b>Time Taken</b><span>${timer.format(timer.value())}</span></div><div class="summary-item"><b>Attempts</b><span>${state.stats.attempts+1}</span></div><div class="summary-item"><b>Best Score</b><span>${Math.max(state.stats.best,state.score).toFixed(2)} /20</span></div></div><div class="breakdown"><b>Category Breakdown</b><p>Classify: ${(state.answers[0]?.points||0).toFixed(2)}/10</p><p>Order the Exchange: ${(state.answers[1]?.points||0).toFixed(2)}/2</p><p>Match the Function: ${(state.answers[2]?.points||0).toFixed(2)}/2</p><p>Choose the Response: ${((state.answers[3]?.points||0)+(state.answers[4]?.points||0)).toFixed(2)}/2</p><p>Complete the Exchange: ${(state.answers.slice(5).reduce((a,b)=>a+(b?.points||0),0)).toFixed(2)}/4</p></div><div class="result-actions"><button class="action-btn" id="review-btn">Review My Answers</button><button class="action-btn secondary-btn" onclick="window.print()">Print Results</button><button class="action-btn secondary-btn" id="save-btn">Save Results</button><button class="action-btn" id="restart-btn">Restart Quiz</button></div></div>`;animateRemark();if(state.score>=16)confetti();$("review-btn").onclick=review;$("restart-btn").onclick=restart;$("save-btn").onclick=saveProgress}
    function animateRemark(){const labels=["Fail","Pass","Fairly Good","Good","Very Good","Excellent!"],target=remark();let i=0,delay=80;function spin(){ $("remark").textContent=labels[i++%labels.length];if(delay<700){delay+=55;setTimeout(spin,delay)}else $("remark").textContent=target}spin()}
    function confetti(){const root=$("confetti"),colors=["#2563eb","#22c55e","#f59e0b","#ef4444"];for(let i=0;i<80;i++){const e=document.createElement("i");e.className="confetti-piece";e.style.left=Math.random()*100+"%";e.style.top="-20px";e.style.background=colors[i%4];e.style.animationDelay=Math.random()*.7+"s";root.appendChild(e)}setTimeout(()=>root.innerHTML="",4000)}
    function review(){const sections={};quizConfig.questions.forEach((q,i)=>{(sections[q.category]??=[]).push({q,i,a:state.answers[i]})});$("results-view").innerHTML=`<div class="results-top"><h1 style="color:#123b70">Review My Answers</h1>${Object.entries(sections).map(([cat,items])=>`<section class="review-section"><h2>${cat}</h2>${items.map(({q,i,a})=>reviewItem(q,a,i)).join("")}</section>`).join("")}<button class="action-btn" id="back-results">Back to Results</button></div>`;$("back-results").onclick=finishQuiz}
    function reviewItem(q,a,i){let content="";if(q.type==="drag-classify")content=q.tiles.map(t=>{const ok=a.placements[t.id]===t.correctColumn;return `<p class="${ok?"":"bad"}">• ${t.text}<br><small>Student's Column: ${a.placements[t.id]} · Correct Column: ${t.correctColumn} ${ok?"✅":"❌"}</small></p>`}).join("");else if(q.type==="drag-order")content=q.lines.map(l=>{let sp=a.order.indexOf(l.id)+1,cp=q.correctOrder.indexOf(l.id)+1;return `<p>• ${l.text}<br><small>Student Position: ${sp} · Correct Position: ${cp} ${sp===cp?"✅":"❌"}</small></p>`}).join("");else if(q.type==="matching")content=q.pairs.map(p=>`<p>• ${p.sentence}<br><small>Student Match: ${a.matches[p.id]} · Correct Function: ${p.correctFunction} ${a.matches[p.id]===p.correctFunction?"✅":"❌"}</small></p>`).join("");else if(q.type==="single-choice")content=`<p>${q.task}</p><p><b>Student Answer:</b> ${a.choice}<br><b>Correct Answer:</b> ${q.correctAnswer}</p>`;else content=`<p>${q.dialogue.map(t=>`${t.speaker}: ${t.text==="..."?a.choice:t.text}`).join("<br>")}</p><p><b>Student Response:</b> ${a.choice}<br><b>Correct Response:</b> ${q.correctAnswer}</p><span class="function-tag show">Function: ${q.function}</span>`;return `<article class="review-card ${a.points>0?"good":"bad"}"><b>Question ${i+1}</b>${content}<p><small><b>Explanation:</b> ${q.explanation}</small></p></article>`}
    function restart(){quizConfig.questions.forEach(q=>delete q._displayChoices);state.index=0;state.answers=Array(9).fill(null);state.score=0;state.correct=0;state.wrong=0;state.order=["b","d","c","a"];state.placements={};state.matches={};state.classifyOrder=null;state.selected=null;state.completed=false;document.onkeydown=null;timer.reset();timer.start();$("results-view").classList.add("hidden");$("quiz-view").classList.remove("hidden");render()}
    initStorage();timer.start();render();
  </script>
 </body>
